name: PHP Lint
on: pull_request
jobs:
  phplint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # php is preinstalled on ubuntu-latest runners, no docker build needed
      - name: php -l
        run: |
          php --version
          # wrap php -l: its exit code 255 would make xargs stop at the first broken file
          find . -name '*.php' -not -path './SVGGraph/*' -print0 | xargs -0 -n1 sh -c 'php -l "$1" || exit 1' _
